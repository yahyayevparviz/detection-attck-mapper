splunk:
  search: index=wineventlog EventCode=4769 Ticket_Encryption_Type=0x17 | stats dc(Service_Name) AS spns
    by Account_Name | where spns > 8
  schedule:
    cron: '*/15 * * * *'
    earliest_time: -15m
