metadata:
  id: IDN-AD-001
  name: Kerberoasting via RC4 Service Ticket Requests
  description: 'Synthetic example rule for the coverage report demo: kerberoasting via rc4 service ticket
    requests.'
  author: analyst1
  date: '2026-02-18'
  version: 1.0.0
  status: active
  severity: high
  supported_siems:
  - splunk
  mitre:
  - tactic: Credential Access
    tactic_id: TA0006
    technique: 'Steal or Forge Kerberos Tickets: Kerberoasting'
